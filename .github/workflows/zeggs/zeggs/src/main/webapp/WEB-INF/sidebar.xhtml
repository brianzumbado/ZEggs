<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:po="http://primefaces.org/omega">
    <h:form id="menuform">
        <div class="sidebar">
            <div class="sidebar-scroll-content">
                <!--                <div class="logo">
                                    <p:link outcome="/omega/dashboard">
                                        <p:graphicImage name="images/logoGallina.png"  library="omega-layout" width="70"/> 
                                    </p:link>
                                </div>-->
                <p:spacer height="5px" />
                <div class="profile">
                    <p:graphicImage name="images/profile1.png" library="omega-layout" />
                    <a id="profile-button" href="#">
                        <span class="username">#{vistaPrincipal.usuario}</span>
                        <i class="pi pi-fw pi-cog"/>
                    </a>
                    <ul>
                        <!--<li><a href="#"><i class="pi pi-fw pi-sliders-h"/><span>Account</span></a></li>-->
                        <!--<li><a href="#"><i class="pi pi-fw pi-bell"/><span>Notifications</span><span class="menu-badge">2</span></a></li>-->
                        <li><a href="../xhtml/login.xhtml"><i class="pi pi-fw pi-sign-out"/><span>#{lbl['sidebar.salir']}</span></a></li>
                    </ul>
                </div>
                <div class="menu">
                    <po:menu widgetVar="OmegaMenuWidget">
                        <p:menuitem id="m_principal" value="#{lbl['sidebar.principal']}" icon="pi pi-fw pi-home" outcome="/xhtml/principal.xhtml"/>
                        <p:submenu id="m_consultas" label="#{lbl['sidebar.consulta']}" icon="pi pi-fw pi-star" >
                            <p:menuitem id="m_cuentaPendiente" value="#{lbl['sidebar.consulta.cuentaPendiente']}" icon="pi pi-fw pi-id-card" outcome="/xhtml/consultas/pendientes"/>                            
                        </p:submenu>
                        <p:submenu id="m_mantenimientos" label="#{lbl['sidebar.mantenimiento']}" icon="pi pi-fw pi-pencil" >
                            <p:menuitem id="m_carton" value="#{lbl['sidebar.mantenimiento.agregarCarton']}" icon="pi pi-fw pi-table" outcome="/xhtml/mantenimientos/carton"/>
                        </p:submenu>
                    </po:menu>
                </div>
            </div>
        </div>
    </h:form>
</ui:composition>
