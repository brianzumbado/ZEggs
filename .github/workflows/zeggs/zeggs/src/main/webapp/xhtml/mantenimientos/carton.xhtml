<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">#{lbl['mantenimiento.agregarCarton.titulo']}</ui:define>

    <ui:define name="content">
        <h:form id="form_m_carton">
            <p:panel>
                <p:panelGrid columns="4" layout="flex"
                             columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                             contentStyleClass="align-items-baseline ui-fluid">
                    <p:outputLabel for="@next" value="Basic"/>
                    <p:selectOneMenu id="option" value="#{vistaMantenimientoCarton.cartonNuevo.idUsuario}" required="true">
                        <f:selectItem itemLabel="Seleccione" itemValue=""/>
                        <f:selectItem itemLabel="ssolisc" itemValue="2"/>
                        <f:selectItem itemLabel="flaco" itemValue="3"/>
                    </p:selectOneMenu>
                    <p:outputLabel for="@next" value="Cantidad"/>
                    <p:inputNumber value="#{vistaMantenimientoCarton.cartonNuevo.cantidad}" required="true"/>
                    <p:outputLabel for="@next" value="Precio"/>
                    <p:inputNumber value="#{vistaMantenimientoCarton.cartonNuevo.precio}" required="true" />
                    <p:outputLabel for="@next" value="Estado"/>
                    <p:selectOneMenu id="estado" value="#{vistaMantenimientoCarton.cartonNuevo.estado}" required="true">
                        <f:selectItem itemLabel="Seleccione" itemValue=""/>
                        <f:selectItem itemLabel="Pendiente" itemValue="0"/>
                        <f:selectItem itemLabel="Cancelado" itemValue="1"/>
                        <f:selectItem itemLabel="Abonado" itemValue="2"/>                                
                    </p:selectOneMenu>
                </p:panelGrid>
                <p:panelGrid columns="2" layout="flex"
                             columnClasses="col-12 md:col-2 xl:col-2, col-12 md:col-6 xl:col-2"
                             contentStyleClass="align-items-baseline ui-fluid">
                    <p:commandButton type="button" value="Guardar" actionListener="#{vistaMantenimientoCarton.agregarCarton()}"/>
                    <p:commandButton type="button" value="Cancelar"/>
                </p:panelGrid>
            </p:panel>
        </h:form>        
    </ui:define>

</ui:composition>
