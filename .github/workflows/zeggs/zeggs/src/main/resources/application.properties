# Configuración de la aplicación ZEggs

# Tiempo de expiración de sesión en minutos
session.timeout.minutes=30

# Número máximo de intentos fallidos antes de bloqueo
max.login.attempts=5

# Tamaño mínimo de contraseña
min.password.length=8

# Tamaño máximo de contraseña
max.password.length=100

# Ruta de redirección por defecto
default.redirect.page=/pages/principal

# Página de acceso denegado
access.denied.page=/pages/acceso-denegado

# Página de inicio de sesión
login.page=/pages/login