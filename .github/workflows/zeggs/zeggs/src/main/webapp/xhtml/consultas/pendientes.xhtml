<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">#{lbl['consulta.cuentaPendiente.titulo']}</ui:define>

    <ui:define name="content">
        <h:form id="form_c_cuentaPendiente">
            <p:panel>
                <p:dataTable id="tablaCarton" var="carton" value="#{vistaCuentaPendiente.listaCartones}" rows="10"
                             paginator="true" paginatorPosition="bottom" widgetVar="tablaCarton"
                             emptyMessage="#{lbl['consulta.cuentaPendiente.tablaVacia']}"
                             reflow="true" stripedRows="true" rowKey="#{carton.idCarton}"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                             rowsPerPageTemplate="5,10,{ShowAll|'All'}">

                    <f:facet name="header" >
                        <p:outputLabel style="font-size: x-large"> #{lbl['consulta.cuentaPendiente.tablaTitulo']} </p:outputLabel>
                    </f:facet>

                    <p:column headerText="#{lbl['consulta.cuentaPendiente.fecha']}">
                        <h:outputText value="#{carton.fecRegistra}" >
                            <f:convertDateTime pattern="dd/MM/yyyy" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="#{lbl['consulta.cuentaPendiente.cantidad']}">
                        <h:outputText value="#{carton.cantidad}" />
                    </p:column>

                    <p:column headerText="#{lbl['consulta.cuentaPendiente.estado']}">
                        <h:outputText value="#{carton.estado eq 0 ? 'Pendiente' : (carton.estado eq 1 ? 'Cancelado' : 'Abonado')}" />
                    </p:column>

                    <p:column headerText="#{lbl['consulta.cuentaPendiente.precio']}">
                        <h:outputText value="#{carton.precio}" >
                            <f:convertNumber type="currency" maxFractionDigits="0" currencySymbol="¢"/>
                        </h:outputText>
                    </p:column>

                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column colspan="3" style="text-align:right" footerText="#{lbl['consulta.cuentaPendiente.total']}"/>
                            <p:column>
                                <f:facet name="footer">
                                    <h:outputText value="#{vistaCuentaPendiente.totalSumListaCartones}">
                                        <f:convertNumber type="currency" maxFractionDigits="0" currencySymbol="¢"/>
                                    </h:outputText>
                                </f:facet>
                            </p:column>
                        </p:row>
                    </p:columnGroup>

                </p:dataTable>
            </p:panel>
        </h:form>        
    </ui:define>

</ui:composition>
