<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">#{lbl['consulta.registroProducto.titulo']}</ui:define>

    <ui:define name="content">
        <p:panel>
            <p:dataTable id="dt-regProd" var="regProd" value="#{vistaConsultaRegProducto.listaRegProd}" rows="10"
                         paginator="true" paginatorPosition="bottom" widgetVar="dt-regProd"
                         emptyMessage="#{lbl['consulta.registroProducto.tablaVacia']}"
                         reflow="true" 
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                         rowsPerPageTemplate="5,10,{ShowAll|'All'}">

                <f:facet name="header" >
                    <p:outputLabel style="font-size: x-large">#{lbl['consulta.registroProducto.tablaTitulo']}</p:outputLabel>
                </f:facet>

                <p:column headerText="#{lbl['consulta.registroProducto.fecha']}" 
                          sortBy="#{regProd.fecRegistra}" 
                          >
                    <h:outputText value="#{regProd.fecRegistra}" >
                        <f:convertDateTime pattern="dd/MM/yyyy" />
                    </h:outputText>
                </p:column>

                <p:column headerText="#{lbl['consulta.registroProducto.grupo']}"
                          sortBy="#{regProd.nombreGrupo}" 
                          >
                    <h:outputText value="#{regProd.nombreGrupo}" />
                </p:column>

                <p:column headerText="#{lbl['consulta.registroProducto.cantidad']}"
                          sortBy="#{regProd.cantidadProducto}" 
                          >
                    <h:outputText value="#{regProd.cantidadProducto}" />
                </p:column>
            </p:dataTable>
            <ui:remove>
                <div class="card">
                    <p:barChart model="#{vistaConsultaRegProducto.lineModel}" style="width: 100%; height: 500px;"/>
                </div>
            </ui:remove>
        </p:panel>

    </ui:define>

</ui:composition>
