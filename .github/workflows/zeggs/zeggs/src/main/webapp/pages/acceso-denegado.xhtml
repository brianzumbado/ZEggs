<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>ZEggs - Acceso Denegado</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</h:head>
<h:body>
    <div class="container">
        <h1>ZEggs - Sistema de Gestión de Huevos</h1>
        <h2>Acceso Denegado</h2>
        
        <p:panel header="Acceso Denegado">
            <p>No tiene permisos para acceder a esta página.</p>
            <p>Por favor, inicie sesión con credenciales válidas.</p>
            
            <p:commandButton value="Volver al Inicio de Sesión" 
                             action="/pages/login?faces-redirect=true"
                             style="margin-top: 10px;"/>
        </p:panel>
    </div>
</h:body>
</html>
